version: "3.8"

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    networks:
      - app-network

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_PASSWORD : "${DB_PASSWORD}"
      DB_URL : "${DB_URL}"
      DB_USERNAME : "${DB_USERNAME}"
      GEMINI_API_KEY : "${GEMINI_API_KEY}"
      GEMINI_PROJECT_ID : "${GEMINI_PROJECT_ID}"
      RAZORPAY_API_KEY : "${RAZORPAY_API_KEY}"
      RAZORPAY_API_SECRETS : "${RAZORPAY_API_SECRETS}"
      SPRING_DATA_REDIS_HOST : "redis"
    networks:
      - app-network

  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    networks:
      - app-network

networks:
  app-network: